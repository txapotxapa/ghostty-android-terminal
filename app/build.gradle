plugins {
    id "com.android.application"
}

// a-sh-qr-pair release line: v<major>.<minor>.<build>.
def versionMajor = 0
def versionMinor = 1
// CI passes -PbuildNumber=<run number>: every main build is a distinct,
// increasing versionCode, which AppUpdater compares against release tags.
def versionBuild = (project.findProperty("buildNumber") ?: "0").toString().toInteger()

android {
    namespace "io.github.sylirre.terminal"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "io.github.sylirre.terminal"
        // 29+: the Zig-built libghostty-vt.a uses ELF TLS, which bionic
        // only supports since API 29.
        minSdk 29
        targetSdk 36
        // Must match AppUpdater.versionCodeOf and the publish-update CI job.
        versionCode(versionMajor * 10000000 + versionMinor * 100000 + versionBuild)
        versionName "${versionMajor}.${versionMinor}.${versionBuild}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Matches the ABIs we ship prebuilt libghostty-vt.a for.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    // Release APKs must all carry one key, or self-updates are rejected. CI
    // gets it from repository secrets; without them release stays unsigned.
    signingConfigs {
        release {
            def ks = System.getenv("A_SH_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("A_SH_KEYSTORE_PASSWORD")
                keyAlias "a-sh"
                keyPassword System.getenv("A_SH_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("A_SH_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The rootfs assets are already xz; don't deflate them again. The VM
        // images are stored undeflated too: the ISO is already compressed, and
        // both are copied out by length, which openFd only reports truthfully
        // for a stored entry.
        noCompress 'xz', 'iso', 'fd'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "a-sh-qr-pair_v${variant.versionName}.apk"
        }
    }
}

// Distribution rootfs tarballs (Alpine/Debian, built by
// scripts/build-*-rootfs.sh) are bundled as assets when present (they are
// never committed; see .gitignore). Without them the app still builds and
// runs — userland sessions are simply unavailable.
def userlandRootfs = rootProject.file("UserlandRootfs")
if (userlandRootfs.isDirectory()) {
    android.sourceSets.main.assets.srcDirs += userlandRootfs
}

// Guest machine images for the VM session type (EDK2 firmware + a bootable
// aarch64 ISO, fetched by scripts/fetch-vm-images.sh) are bundled the same way
// and on the same terms: never committed, and absent they only disable that
// session type. They are large — the ISO alone is ~90 MB — so a build without
// them is the normal one for anyone not working on the VM.
def vmImages = rootProject.file("VmImages")
if (vmImages.isDirectory()) {
    android.sourceSets.main.assets.srcDirs += vmImages
}

dependencies {
    // Pure-Java XZ decoder for the rootfs installer (tar parsing is local
    // code: the rootfs tarballs only need files/dirs/links).
    implementation "org.tukaani:xz:1.10"
    // In-app QR scan for SSH pairing (SshLinks). Google's code scanner runs
    // in Play services, so the app itself needs no camera permission.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"

    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
