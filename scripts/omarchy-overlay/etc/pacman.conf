# Omarchy-flavored pacman.conf for the A-SH userland.
#
# Differences from stock Arch Linux ARM are forced by the user-space
# emulator: no Landlock sandbox (DisableSandbox), no privilege-dropped
# downloads (no DownloadUser), no mount-table space check
# (CheckSpace is commented out — /proc/mounts doesn't describe the rootfs).

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 5
DisableSandbox
#CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Space: only English translations, no C-library man pages or docs. Keeps
# them out of updates too (the rootfs build uses the same list).
NoExtract   = usr/share/locale/* !usr/share/locale/en* !usr/share/locale/locale.alias
NoExtract   = usr/share/man/man3/* usr/share/doc/* usr/share/info/* usr/share/gtk-doc/*
NoExtract   = usr/share/gir-1.0/*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
