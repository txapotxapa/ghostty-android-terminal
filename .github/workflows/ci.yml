name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  # Fast feedback: compile + native link, publish the APK.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Omarchy (Arch Linux ARM) replaces Debian in the published APK
      # (scripts/build-debian-rootfs.sh still works for a local build).
      # pacstrap needs pacman, so the script runs in the Arch container;
      # qemu binfmt (F flag) runs the aarch64 package scriptlets.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Omarchy rootfs
        run: |
          docker run --rm --privileged -v "$PWD:/w" -w /w archlinux:latest bash -c '
            pacman -Sy --noconfirm --needed curl xz libarchive >/dev/null &&
            ./scripts/build-omarchy-rootfs.sh &&
            chown -R '"$(id -u):$(id -g)"' UserlandRootfs'

      # Needs only curl + xz (preinstalled on the runner); the published APK
      # then bundles both distros for the onboarding chooser.
      - name: Build Alpine rootfs
        run: ./scripts/build-alpine-rootfs.sh

      # ndkVersion from app/build.gradle is auto-installed by AGP via
      # sdkmanager (licenses are pre-accepted on hosted runners).
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      # Signed release APK for self-updates (AppUpdater). Needs the
      # A_SH_KEYSTORE_B64 / A_SH_KEYSTORE_PASSWORD repository secrets.
      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.A_SH_KEYSTORE_B64 }}
          A_SH_KEYSTORE_PASSWORD: ${{ secrets.A_SH_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "no signing secrets; skipping"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/a-sh.jks"
          A_SH_KEYSTORE="$RUNNER_TEMP/a-sh.jks" ./gradlew :app:assembleRelease -PbuildNumber=${{ github.run_number }}
          rm -f "$RUNNER_TEMP/a-sh.jks"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # outputFileName renames this to A-SH_v<version>.apk
          # (app/build.gradle), so match by glob rather than a fixed name.
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Full integration suite on an emulator; see docs/testing.md.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Bundle the Alpine rootfs (~3 MB asset, curl + xz only) so the suite
      # covers the bundled-asset paths — distro discovery, the onboarding
      # chooser cards, and a real Alpine login session under arm64chroot
      # (UserlandAlpineSessionTest). Debian is deliberately NOT built here:
      # mmdebstrap plus the ~33 MB asset would slow the job, so
      # UserlandSessionTest remains a local-run suite (docs/testing.md).
      - name: Build Alpine rootfs
        run: ./scripts/build-alpine-rootfs.sh

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Espresso clicks need animations off (docs/testing.md).
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          # CI's software-rendered emulator occasionally drops/delays
          # Espresso input-render round-trips under load, timing out an
          # otherwise-passing UI test; retry the whole suite once before
          # failing the job (docs/testing.md).
          script: ./gradlew connectedDebugAndroidTest || ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/

  # On a tag push, publish a GitHub release with the debug APK attached,
  # but only once build and the full instrumented suite have gone green.
  release:
    needs: [build, instrumented-tests]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Create release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true

  # Every main build becomes a release a-sh-qr-pair_v0.1.<run>; installed
  # apps pick it up automatically (AppUpdater). Not gated on the emulator
  # suite, which is slow and flaky on hosted runners; tag releases above are.
  publish-update:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        id: apk
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-release

      - name: Publish update release
        if: steps.apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls a-sh-qr-pair_v*.apk | head -n1)
          name=${apk%.apk}
          gh release create "$name" "$apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "$name" \
            --notes "Automatic build of ${{ github.sha }}." --latest
