<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FD1B9}a:hover{color:#A8E3D1}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121314; color: #ECECEA; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 6px">
    <a href="/AgentBoard.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #ECECEA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; font-size: 17px; font-weight: 600">New agent</div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; color: #9A9C9F; letter-spacing: 0.04em">HARNESS</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{harnesses}}" as="h" hint-placeholder-count="4">
          <button onClick="{{h.pick}}" style="min-height: 64px; padding: 10px 12px; border-radius: 14px; border: 1px solid {{h.border}}; background: {{h.bg}}; text-align: left; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 14px; font-weight: 600">{{h.name}}</span>
            <span style="font-size: 12px; color: #9A9C9F">{{h.sub}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; color: #9A9C9F; letter-spacing: 0.04em">FOLDER</div>
      <div style="background: #1A1B1E; border: 1px solid #26282C; border-radius: 14px; overflow: hidden">
        <sc-for list="{{repos}}" as="r" hint-placeholder-count="3">
          <button onClick="{{r.pick}}" style="width: 100%; min-height: 48px; padding: 0 14px; border: 0; border-bottom: 1px solid #222428; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left">
            <span style="flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 13px">{{r.path}}</span>
            <span style="font-size: 12px; color: #9A9C9F">{{r.branch}}</span>
            <span style="width: 18px; color: #7FD1B9">{{r.mark}}</span>
          </button>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px">
        <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7FD1B9">
        Run in its own git worktree
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; color: #9A9C9F; letter-spacing: 0.04em">FIRST PROMPT</div>
      <label for="fp" style="position: absolute; width: 1px; height: 1px; overflow: hidden">First prompt</label>
      <textarea id="fp" rows="3" placeholder="What should it work on? Hold the mic to dictate." style="background: #1A1B1E; border: 1px solid #26282C; border-radius: 14px; padding: 12px 14px; color: #ECECEA; font: 15px/1.45 'IBM Plex Sans', sans-serif; resize: none; outline: none"></textarea>
      <div style="display: flex; gap: 8px">
        <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #2A2C30; background: transparent; font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #B3B4B0">model · default</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #2A2C30; background: transparent; font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #B3B4B0">plan mode</button>
      </div>
    </div>
  </main>

  <footer style="padding: 10px 16px 22px; display: flex; gap: 8px">
    <button aria-label="Dictate prompt" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid #2A2C30; background: #1F2124; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg>
    </button>
    <a href="AgentDetail.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: #7FD1B9; color: #0E1412; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Start {{picked}} in herdr</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { h: 'omp', r: 0 }; }
  renderVals() {
    const H = [
      { id: 'omp', name: 'oh-my-pi', sub: 'coding, subagents' },
      { id: 'hermes', name: 'Hermes', sub: 'skills, memory' },
      { id: 'claude', name: 'Claude Code', sub: 'stream-json trace' },
      { id: 'sh', name: 'Plain shell', sub: 'herdr pane' }
    ];
    const R = [
      { path: '~/cvcn-storefront', branch: 'main' },
      { path: '~/agroforestry-planner', branch: 'dev' },
      { path: '~/lab-notes', branch: 'main' }
    ];
    return {
      picked: H.find((x) => x.id === this.state.h).name,
      harnesses: H.map((x) => Object.assign({}, x, {
        bg: x.id === this.state.h ? '#1E2A26' : '#1A1B1E',
        border: x.id === this.state.h ? '#7FD1B9' : '#26282C',
        pick: () => this.setState({ h: x.id })
      })),
      repos: R.map((x, i) => Object.assign({}, x, {
        mark: i === this.state.r ? '✓' : '',
        pick: () => this.setState({ r: i })
      }))
    };
  }
}
</script>
</body>
</html>
